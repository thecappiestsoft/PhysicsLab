<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhysicsLab</title>
    <meta
      name="description"
      content="PhysicsLab — interaktywne laboratorium fizyki: 36 symulacji, wykresy, pomiary i zadania. Interactive physics lab."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/simulation.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <a class="brand" data-go="home" role="link" tabindex="0">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="30" height="30" rx="9" fill="var(--accent)" />
            <ellipse cx="16" cy="16" rx="11" ry="4.3" stroke="var(--accent-ink)" stroke-width="1.7" />
            <ellipse
              cx="16"
              cy="16"
              rx="11"
              ry="4.3"
              transform="rotate(60 16 16)"
              stroke="var(--accent-ink)"
              stroke-width="1.7"
            />
            <ellipse
              cx="16"
              cy="16"
              rx="11"
              ry="4.3"
              transform="rotate(-60 16 16)"
              stroke="var(--accent-ink)"
              stroke-width="1.7"
            />
            <circle cx="16" cy="16" r="2.4" fill="var(--accent-ink)" />
          </svg>
          <span>PhysicsLab</span>
        </a>
        <nav class="main" id="nav"></nav>
        <div class="spacer"></div>
        <button class="iconbtn" id="boardBtn" aria-pressed="false">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M12 16v4M8 20h8" />
          </svg>
        </button>
        <div class="seg" id="langSeg" role="group" aria-label="Language">
          <button data-lang="pl">PL</button><button data-lang="en">EN</button>
        </div>
        <div class="seg" id="themeSeg" role="group">
          <button data-theme="light">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4.2" />
              <path
                d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"
              />
            </svg>
          </button>
          <button data-theme="dark">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main><div class="wrap" id="app"></div></main>
    <footer class="foot"><div class="wrap">© 2026 CappySoft.pl</div></footer>
    <div class="toast" id="toast"></div>

    <!-- Core -->
    <script src="js/core/storage.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/core/registry.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/format.js"></script>
    <script src="js/core/draw.js"></script>
    <script src="js/core/chart.js"></script>
    <script src="js/core/engine.js"></script>
    <script src="js/core/views.js"></script>
    <!-- Translations -->
    <script src="js/i18n/pl.js"></script>
    <script src="js/i18n/en.js"></script>
    <!-- Simulations -->
    <script src="js/sims/shared/presets.js"></script>
    <script src="js/sims/shared/drawing.js"></script>
    <script src="js/sims/mechanics/linear-motion.js"></script>
    <script src="js/sims/mechanics/free-fall.js"></script>
    <script src="js/sims/mechanics/vertical-throw.js"></script>
    <script src="js/sims/mechanics/projectile.js"></script>
    <script src="js/sims/dynamics/newton-2-friction.js"></script>
    <script src="js/sims/dynamics/inclined-plane.js"></script>
    <script src="js/sims/dynamics/newton-3.js"></script>
    <script src="js/sims/dynamics/newton-1.js"></script>
    <script src="js/sims/energy/skate-track.js"></script>
    <script src="js/sims/energy/elastic-energy.js"></script>
    <script src="js/sims/energy/work.js"></script>
    <script src="js/sims/waves/pendulum.js"></script>
    <script src="js/sims/waves/spring-oscillator.js"></script>
    <script src="js/sims/waves/string-wave.js"></script>
    <script src="js/sims/waves/sound.js"></script>
    <script src="js/sims/waves/interference.js"></script>
    <script src="js/sims/electricity/_circuit.js"></script>
    <script src="js/sims/electricity/ohms-law.js"></script>
    <script src="js/sims/electricity/series-parallel.js"></script>
    <script src="js/sims/electricity/meters.js"></script>
    <script src="js/sims/magnetism/_magnet.js"></script>
    <script src="js/sims/magnetism/magnet-compass.js"></script>
    <script src="js/sims/magnetism/current-wire.js"></script>
    <script src="js/sims/magnetism/electromagnet.js"></script>
    <script src="js/sims/magnetism/induction.js"></script>
    <script src="js/sims/magnetism/motor.js"></script>
    <script src="js/sims/optics/_optics.js"></script>
    <script src="js/sims/optics/lenses.js"></script>
    <script src="js/sims/optics/mirrors.js"></script>
    <script src="js/sims/optics/refraction.js"></script>
    <script src="js/sims/thermodynamics/_thermo.js"></script>
    <script src="js/sims/thermodynamics/heat-balance.js"></script>
    <script src="js/sims/thermodynamics/conduction.js"></script>
    <script src="js/sims/thermodynamics/ideal-gas.js"></script>
    <script src="js/sims/thermodynamics/expansion.js"></script>
    <script src="js/sims/atomic/_light.js"></script>
    <script src="js/sims/atomic/atom.js"></script>
    <script src="js/sims/atomic/decay.js"></script>
    <script src="js/sims/atomic/shielding.js"></script>
    <script src="js/sims/atomic/photoelectric.js"></script>
    <script src="js/sims/atomic/spectra.js"></script>
    <!-- Start -->
    <script src="js/core/app.js"></script>
  </body>
</html>
